# Public GitHub-hosted runners for release validation and all store uploads.
name: Publish Pleazyng store builds
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}:channel:{3}', inputs.action, inputs.runner_pool, inputs.release_tag, inputs.channel) }}${{ startsWith(inputs.channel, 'google-play') && format(':track:{0}:status:{1}', inputs.play_track, inputs.play_release_status) || '' }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Store publication action
        required: true
        type: choice
        options: [publish-app-stores]
      runner_pool:
        description: Public GitHub-hosted runner pool
        required: true
        type: choice
        default: public
        options: [public]
      release_tag:
        description: Published GitHub release tag whose signed store build should be submitted
        required: true
        type: string
      channel:
        description: Store channel to update
        required: true
        type: choice
        options:
          - google-play
          - google-play-automotive
          - amazon-appstore
          - app-store-ios
          - app-store-tvos
      play_track:
        description: Google Play track (used only for google-play)
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      play_release_status:
        description: Play release status; draft keeps it out of distribution until reviewed in Play Console
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
          - inProgress
      play_rollout_fraction:
        description: Fraction for an explicitly selected inProgress rollout; automatic delivery uses completed
        type: string
        default: '0.1'

# Publication gates run before any external store mutation.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read
  attestations: read

concurrency:
  group: app-store-publish-${{ startsWith(inputs.channel, 'google-play') && 'google-play' || inputs.channel }}-${{ startsWith(inputs.channel, 'google-play') && 'org.snapetech.pleazyng' || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate published release
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      apple_recovery: ${{ steps.validate.outputs.apple_recovery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require the protected main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Store submissions may only run from refs/heads/main." >&2
            exit 1
          fi

      - name: Validate release tag and required asset
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
          PLAY_TRACK: ${{ inputs.play_track }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic versioning: $RELEASE_TAG" >&2
            exit 1
          fi
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          is_draft=$(jq -r '.draft' <<< "$release_json")
          is_prerelease=$(jq -r '.prerelease' <<< "$release_json")
          if [[ "$is_prerelease" != "false" ]]; then
            echo "Store uploads do not accept GitHub prereleases." >&2
            exit 1
          fi
          if [[ "$is_draft" == "true" ]]; then
            case "$CHANNEL" in
              google-play|google-play-automotive)
                if [[ "$PLAY_TRACK" == "production" ]]; then
                  echo "Draft GitHub releases may only upload to non-production Google Play tracks." >&2
                  exit 1
                fi
                ;;
              amazon-appstore|app-store-ios|app-store-tvos)
                # These lanes upload binaries without submitting them for store review.
                ;;
              *) echo "Draft GitHub releases are only allowed for non-production store uploads." >&2; exit 1 ;;
            esac
          elif [[ "$is_draft" != "false" ]]; then
            echo "Unexpected GitHub release draft state: $is_draft" >&2
            exit 1
          fi
          case "$CHANNEL" in
            google-play-automotive) required_asset=pleazyng-automotive-play.aab ;;
            google-play) required_asset=pleazyng-android-play.aab ;;
            amazon-appstore) required_asset=pleazyng-amazon-firetv.apk ;;
            app-store-ios) required_asset=pleazyng-ios-appstore.ipa ;;
            app-store-tvos) required_asset=pleazyng-tvos-appstore.ipa ;;
            *) echo "Unknown store channel: $CHANNEL" >&2; exit 1 ;;
          esac
          if ! jq -e --arg asset "$required_asset" '.assets | any(.name == $asset)' <<< "$release_json" >/dev/null; then
            echo "Release $RELEASE_TAG has no $required_asset; rebuild it with the channel's signing credentials configured." >&2
            exit 1
          fi
          if ! jq -e '.assets | any(.name == "SHA256SUMS.txt")' <<< "$release_json" >/dev/null; then
            echo "Release $RELEASE_TAG is missing SHA256SUMS.txt." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == app-store-ios || "$CHANNEL" == app-store-tvos ]]; then
            sidecar_count=$(jq '[.assets[] | select(.name == "APPLE-STORE-SHA256SUMS.txt" or .name == "APPLE-STORE-RECOVERY.json") | .name] | unique | length' <<< "$release_json")
            case "$sidecar_count" in
              0) echo "apple_recovery=false" >> "$GITHUB_OUTPUT" ;;
              2) echo "apple_recovery=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "Apple recovery requires both unique sidecar assets." >&2; exit 1 ;;
            esac
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish-google-play:
    name: Upload to Google Play
    needs: validate-release
    if: ${{ startsWith(inputs.channel, 'google-play') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
      actions: read
    env:
      PLAY_BUNDLE: ${{ inputs.channel == 'google-play-automotive' && 'pleazyng-automotive-play.aab' || 'pleazyng-android-play.aab' }}
      PLAY_TRACK: ${{ inputs.channel == 'google-play-automotive' && format('automotive:{0}', inputs.play_track == 'internal' && 'qa' || inputs.play_track) || inputs.play_track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download and verify the signed App Bundle
        id: bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PLAY_BUNDLE" --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/store-assets"
          cd "$RUNNER_TEMP/store-assets"
          sha256sum --check --ignore-missing SHA256SUMS.txt
          python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          gh release download 1.18.3 --repo google/bundletool --pattern bundletool-all-1.18.3.jar --dir "$RUNNER_TEMP"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool-all-1.18.3.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool-all-1.18.3.jar" dump manifest --bundle="$PLAY_BUNDLE" > "$RUNNER_TEMP/store-manifest.xml"
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, sys
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts'))
          from pubspec_version import parse_pubspec_version
          tag = os.environ['RELEASE_TAG']
          source = json.loads(subprocess.check_output(['gh', 'api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/pubspec.yaml?ref={tag}"], text=True))
          version, code = parse_pubspec_version(base64.b64decode(source['content']).decode())
          if tag.lstrip('v') != version.split('+')[0] or int(code) < 189:
              raise ValueError('Expected a fresh release with matching immutable source metadata')
          from xml.etree import ElementTree as ET
          manifest = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'store-manifest.xml')).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          automotive = os.environ['PLAY_TRACK'].startswith('automotive:')
          code = int(code) + (1_000_000_000 if automotive else 0)
          required = any(f.get(android + 'name') == 'android.hardware.type.automotive' and
              f.get(android + 'required', 'true') == 'true' for f in manifest.findall('uses-feature'))
          if (manifest.get('package') != 'org.snapetech.pleazyng' or required != automotive or
                  int(manifest.get(android + 'versionCode', '0')) != code):
              raise ValueError('Bundle manifest does not match its release or form factor')
          with open(os.environ['PLAY_BUNDLE'], 'rb') as bundle:
              digest = hashlib.file_digest(bundle, 'sha256').hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version_code={code}\naab_sha256={digest}\n')
          PY

      - name: Install native Ruby extension tools on public Linux
        if: inputs.runner_pool == 'public'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libyaml-dev libffi-dev zlib1g-dev

      - name: Verify provisioned native Ruby extension tools
        shell: bash
        run: |
          command -v cc
          command -v make
          command -v pkg-config
          pkg-config --exists openssl yaml-0.1 libffi zlib

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate delivery transactions in the selected Ruby runtime
        run: ruby scripts/checks/test_play_delivery_transactions.rb

      - name: Recover a matching interrupted delivery transaction
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          VERSION_CODE: ${{ steps.bundle.outputs.version_code }}
          AAB_SHA256: ${{ steps.bundle.outputs.aab_sha256 }}
        run: |
          python3 scripts/stores/deliver_play_releases.py --restore --tag "$RELEASE_TAG" \
            --version-code "$VERSION_CODE" --aab-sha256 "$AAB_SHA256" --track "$PLAY_TRACK" \
            --receipt "$RUNNER_TEMP/play-delivery/receipt.json"

      - name: Upload and verify the selected Play track
        env:
          PLAY_AAB_PATH: ${{ runner.temp }}/store-assets/${{ env.PLAY_BUNDLE }}
          PLAY_DELIVERY_RECEIPT: ${{ runner.temp }}/play-delivery/receipt.json
          PLAY_EXPECTED_VERSION_CODE: ${{ steps.bundle.outputs.version_code }}
          PLAY_RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          PLAY_RELEASE_STATUS: ${{ inputs.play_release_status }}
          PLAY_ROLLOUT_FRACTION: ${{ inputs.play_rollout_fraction || '0.1' }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$SUPPLY_JSON_KEY_DATA" ]]; then
            echo "Configure GOOGLE_PLAY_SERVICE_ACCOUNT_JSON before publishing to Google Play." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/play-delivery"
          bundle exec ruby scripts/stores/publish_play_release.rb

      - name: Retain the non-secret delivery/recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: google-play-delivery-receipt
          path: ${{ runner.temp }}/play-delivery/receipt.json
          retention-days: 30

  publish-amazon-appstore:
    name: Upload to Amazon Appstore
    needs: validate-release
    if: ${{ inputs.channel == 'amazon-appstore' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download and verify the signed Fire TV APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern pleazyng-amazon-firetv.apk --pattern pleazyng-amazon-firetv-provenance.json --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/store-assets"
          cd "$RUNNER_TEMP/store-assets"
          sha256sum --check --ignore-missing SHA256SUMS.txt
          python3 "$GITHUB_WORKSPACE/scripts/verify_firetv_apk.py" pleazyng-amazon-firetv.apk \
            --receipt pleazyng-amazon-firetv-provenance.json

      - name: Install Android TV emulator image
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install emulator platform-tools 'system-images;android-35;android-tv;x86_64'
          printf 'no\n' | "$AVDMANAGER" create avd --force --name pleazyng-firetv-api35 \
            --package 'system-images;android-35;android-tv;x86_64' --device tv_1080p

      - name: Boot Fire TV emulator and run Amazon APK qualification
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd pleazyng-firetv-api35 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4 \
            -port 5586 > "$RUNNER_TEMP/firetv-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/firetv-emulator.pid"
          trap 'kill "$(cat "$RUNNER_TEMP/firetv-emulator.pid")" 2>/dev/null || true' EXIT
          timeout 300 adb -s emulator-5586 wait-for-device
          for _ in $(seq 1 150); do
            [[ "$(adb -s emulator-5586 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          if [[ "$(adb -s emulator-5586 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]]; then
            cat "$RUNNER_TEMP/firetv-emulator.log"
            echo 'Fire TV form-factor emulator failed to boot.' >&2
            exit 1
          fi
          python3 scripts/qa/test_firetv_emulator.py \
            --apk "$RUNNER_TEMP/store-assets/pleazyng-amazon-firetv.apk" \
            --serial emulator-5586 --output-dir "$RUNNER_TEMP/firetv-qualification"

      - name: Retain Fire TV emulator qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firetv-emulator-qualification-${{ inputs.release_tag }}
          path: |
            ${{ runner.temp }}/firetv-qualification/
            ${{ runner.temp }}/firetv-emulator.log
          if-no-files-found: warn
          retention-days: 90

      - name: Install native Ruby extension tools on public Linux
        if: inputs.runner_pool == 'public'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libyaml-dev libffi-dev zlib1g-dev

      - name: Verify provisioned native Ruby extension tools
        shell: bash
        run: |
          command -v cc
          command -v make
          command -v pkg-config
          pkg-config --exists openssl yaml-0.1 libffi zlib

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload the APK without submitting it for review
        env:
          AMAZON_APPSTORE_APP_ID: ${{ vars.AMAZON_APPSTORE_APP_ID }}
          AMAZON_APK_PATH: ${{ runner.temp }}/store-assets/pleazyng-amazon-firetv.apk
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
        run: |
          if [[ -z "$AMAZON_CLIENT_ID" || -z "$AMAZON_CLIENT_SECRET" ]]; then
            echo "Configure AMAZON_APPSTORE_CLIENT_ID and AMAZON_APPSTORE_CLIENT_SECRET before publishing to Amazon Appstore." >&2
            exit 1
          fi
          bundle exec fastlane android publish_amazon_appstore

  publish-apple-app-store:
    name: Upload to Apple App Store Connect
    needs: validate-release
    if: ${{ inputs.channel == 'app-store-ios' || inputs.channel == 'app-store-tvos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Apple platform asset
        id: apple-asset
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" == "app-store-ios" ]]; then
            echo "asset=pleazyng-ios-appstore.ipa" >> "$GITHUB_OUTPUT"
            echo "platform=ios" >> "$GITHUB_OUTPUT"
          else
            echo "asset=pleazyng-tvos-appstore.ipa" >> "$GITHUB_OUTPUT"
            echo "platform=appletvos" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify signed IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          IPA_ASSET: ${{ steps.apple-asset.outputs.asset }}
          APPLE_STORE_PLATFORM: ${{ steps.apple-asset.outputs.platform }}
          APPLE_RECOVERY: ${{ needs.validate-release.outputs.apple_recovery }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store-assets"
          patterns=(--pattern "$IPA_ASSET" --pattern SHA256SUMS.txt)
          if [[ "$APPLE_RECOVERY" == true ]]; then
            patterns+=(--pattern APPLE-STORE-SHA256SUMS.txt --pattern APPLE-STORE-RECOVERY.json)
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "${patterns[@]}" --dir "$RUNNER_TEMP/store-assets"
          cd "$RUNNER_TEMP/store-assets"
          python3 - <<'PYHASH'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"] + "/scripts")
          from verify_apple_store_recovery import verify_downloaded_ipa
          names = verify_downloaded_ipa(
              Path.cwd(), release_tag=os.environ["RELEASE_TAG"],
              asset_name=os.environ["IPA_ASSET"], recovery=os.environ["APPLE_RECOVERY"] == "true",
          )
          Path("apple-attestation-inputs.txt").write_text("\n".join(names) + "\n")
          PYHASH
          while IFS= read -r asset; do
            python3 "$GITHUB_WORKSPACE/scripts/verify_release_attestation.py" "$asset" --repo "$GITHUB_REPOSITORY"
          done < apple-attestation-inputs.txt
          python3 "$GITHUB_WORKSPACE/scripts/verify_apple_store_ipa.py" "$IPA_ASSET" \
            --platform "$APPLE_STORE_PLATFORM" --expected-version "${RELEASE_TAG#v}"

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify Apple processing guard offline
        run: |
          ruby scripts/checks/test_apple_store_processing.rb
          python3 -m unittest scripts.checks.test_apple_store_lane

      - name: Upload binary to App Store Connect without submitting for review
        env:
          APPLE_IPA_PATH: ${{ runner.temp }}/store-assets/${{ steps.apple-asset.outputs.asset }}
          APPLE_STORE_PLATFORM: ${{ steps.apple-asset.outputs.platform }}
          APPLE_RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          APPLE_PROCESSING_RECEIPT_PATH: ${{ runner.temp }}/store-assets/apple-processing-receipt.json
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER_ID" || -z "$APPLE_API_PRIVATE_KEY" ]]; then
            echo "Configure APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, and APPLE_API_PRIVATE_KEY before publishing to App Store Connect." >&2
            exit 1
          fi
          bundle exec fastlane ios upload_appstore_build

      - name: Retain verified App Store processing receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-processing-${{ inputs.channel }}-${{ needs.validate-release.outputs.release_tag }}
          path: ${{ runner.temp }}/store-assets/apple-processing-receipt.json
          if-no-files-found: error
          overwrite: true
