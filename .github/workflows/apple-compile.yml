name: Unsigned Apple compile
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'macos/**'
      - 'tvos/**'
      - 'shared/apple/**'
      - 'native/**/apple/**'
      - 'packages/**/ios/**'
      - 'packages/**/macos/**'
      - 'packages/**/darwin/**'
      - 'mpv-build.lock.json'
      - '.github/actions/apple-native-reliability/**'
      - '.github/actions/setup-flutter-apple/**'
      - '.github/workflows/apple-compile.yml'
      - 'scripts/checks/clang_compilation_fragments.py'
      - 'scripts/checks/native_lint.py'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'macos/**'
      - 'tvos/**'
      - 'shared/apple/**'
      - 'native/**/apple/**'
      - 'packages/**/ios/**'
      - 'packages/**/macos/**'
      - 'packages/**/darwin/**'
      - 'mpv-build.lock.json'
      - '.github/actions/apple-native-reliability/**'
      - '.github/actions/setup-flutter-apple/**'
      - '.github/workflows/apple-compile.yml'
      - 'scripts/checks/clang_compilation_fragments.py'
      - 'scripts/checks/native_lint.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: Unsigned Apple compile (${{ matrix.platform }})
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            slug: ios
          - platform: macOS
            slug: macos
          - platform: tvOS
            slug: tvos
    # Native tests and their simulator dependencies build arm64 on every platform.
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      LANG: en_US.UTF-8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require native Apple Silicon host
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Load pinned Flutter SDK
        shell: bash
        run: python3 scripts/flutter/load_sdk_pin.py --github-env
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: '27.2'
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Ensure CMake for the embedded Steam receiver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          command -v gtimeout >/dev/null || brew install coreutils
          cmake --version
      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          { echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"; echo "GEM_PATH=$gem_path"; } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems" GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version
      - name: Select clang-tidy for changed Apple native sources
        shell: bash
        env:
          TARGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${TARGET_BASE:-HEAD^}"
          if [[ "$GITHUB_REF" == refs/heads/integration/upstream-* || "$base" =~ ^0+$ ]]; then base=origin/main; fi
          base="$(git merge-base "$base" HEAD)"
          if git diff --quiet "$base" HEAD -- native/games/apple ':(glob)native/games/steam/**/*.h'; then exit 0; fi
          if ! command -v clang-tidy >/dev/null; then
            brew list --versions llvm >/dev/null || brew install llvm
            tidy="$(brew --prefix llvm)/bin/clang-tidy"
          else
            tidy="$(command -v clang-tidy)"
          fi
          "$tidy" --version
          echo "PLEAZYNG_APPLE_TIDY=$tidy" >> "$GITHUB_ENV"
          echo "PLEAZYNG_APPLE_TIDY_BASE=$base" >> "$GITHUB_ENV"
      - name: Test Dolby Vision runtime preparation and compatibility fallback
        if: matrix.slug == 'macos'
        run: swift test --package-path shared/apple/DVRuntimeAPI --scratch-path "$RUNNER_TEMP/dv-runtime-api"
      - name: Compile Apple application and tests
        uses: ./.github/actions/apple-native-reliability
        timeout-minutes: 110
        with:
          platform: ${{ matrix.platform }}
          build-only: 'true'
        env:
          PUB_CACHE: ${{ runner.temp }}/apple-native-pub-${{ matrix.slug }}
