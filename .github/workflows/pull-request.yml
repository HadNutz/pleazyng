# Untrusted pull-request code runs only on disposable public GitHub-hosted
# runners, with read-only repository access and no repository secrets.
name: Pull request checks

on:
  push:
    branches: ['integration/upstream-*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve the suite for each published integration checkpoint. Duplicate events
  # for the same reviewed head share a group and ordinary PRs still supersede old runs.
  group: pull-request-${{ github.head_ref || github.ref_name }}-${{ startsWith(github.head_ref || github.ref_name, 'integration/upstream-') && (github.event.pull_request.head.sha || github.sha) || 'latest' }}
  cancel-in-progress: true

env:
  DASH__SUPPRESS_ANALYTICS: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  checks:
    name: Flutter checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out revision for validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changelog entry
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/changelog.py validate --mode range --base "$CHANGELOG_BASE" --head "$CHANGELOG_HEAD"

      - name: Load pinned Flutter SDK
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pull-request-pub-v1-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install system dependencies
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo python3 scripts/configure_hosted_apt.py "$RUNNER_ENVIRONMENT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential cmake ffmpeg

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prefetch checksum-pinned host native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64

      - name: Install wakelock_plus development dependencies
        id: prepared
        working-directory: packages/wakelock_plus
        run: flutter pub get --enforce-lockfile --no-example

      - name: Verify generated files
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: scripts/codegen.sh --check

      - name: Check Dart file growth and wildcard error handling
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-HEAD^}"
          if [[ "$GITHUB_REF" == refs/heads/integration/upstream-* || "$base" =~ ^0+$ ]]; then base=origin/main; fi
          dart run scripts/checks/dart_source_ratchet.dart "$base"

      - name: Verify translation hygiene
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          python3 scripts/checks/clean_translations.py --check --strict
          python3 scripts/checks/check_localizations.py
          python3 scripts/codegen/generate_localized_quantities.py --check
          python3 scripts/codegen/generate_platform_locales.py --check

      - name: Verify workflow and script guards
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: bash scripts/ci_guard_checks.sh

      - name: Verify formatting
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: bash scripts/format_dart.sh --check

      - name: Verify icon consistency
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: dart run scripts/checks/check_icon_consistency.dart

      - name: Analyze code
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: dart run scripts/checks/check_analyzer.dart

      - name: Check for unused code and files
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        run: |
          set -euo pipefail
          dart run dart_code_linter:metrics check-unused-code lib 2>&1 | tee unused_code.txt
          grep -qi "no unused code found" unused_code.txt
          dart run dart_code_linter:metrics check-unused-files lib 2>&1 | tee unused_files.txt
          grep -qi "no unused files found" unused_files.txt

  tests:
    name: Flutter suite (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out revision for validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load pinned Flutter SDK
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pull-request-pub-v1-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install system dependencies
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo python3 scripts/configure_hosted_apt.py "$RUNNER_ENVIRONMENT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential cmake ffmpeg

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prefetch checksum-pinned host native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform linux --arch x64

      - name: Run complete assigned test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/flutter_suite_shard.py --count 4 --index "$SHARD"

      - name: Retain failed visual comparisons
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flutter-golden-differences-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7
