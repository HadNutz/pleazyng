name: Signed macOS App Store release
run-name: macos-app-store:${{ inputs.profile_inspection_only == true && 'profile-inspection' || inputs.preflight_only == true && 'signing-preflight' || 'signed-upload' }}:${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated immutable release tag to build and upload
        required: true
        type: string
        default: v3.0.36
      preflight_only:
        description: Verify persistent signing identities locally without building or uploading
        required: false
        type: boolean
        default: false
      profile_inspection_only:
        description: Read current App Store provisioning profile metadata without creating profiles or accessing keychains
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: pleazyng-macos-app-store-signing
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
  BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
  BUNDLE_FROZEN: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DASH__SUPPRESS_ANALYTICS: "true"
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-v1

jobs:
  build-upload:
    name: Build and upload signed Mac App Store package
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && inputs.profile_inspection_only != true
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","gha-{0}-build-upload"]}}', github.run_id)) }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the immutable product release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release source before running tagged code
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --validate-source-only \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --main-commit "$GITHUB_SHA"

      - name: Verify workflow mode selection
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          PROFILE_INSPECTION_ONLY: ${{ inputs.profile_inspection_only }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_ONLY" == true && "$PROFILE_INSPECTION_ONLY" == true ]]; then
            echo "Choose either signing preflight or profile inspection." >&2
            exit 1
          fi

      - name: Configure isolated Ruby bundle path
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        shell: bash
        run: echo "BUNDLE_PATH=$RUNNER_TEMP/fastlane-bundle" >> "$GITHUB_ENV"

      - name: Preflight macOS build disk capacity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --capacity-preflight-only \
            --minimum-free-gib 32 \
            --capacity-root "workspace=$GITHUB_WORKSPACE" \
            --capacity-root "source=$GITHUB_WORKSPACE/source" \
            --capacity-root "runner-temp=$RUNNER_TEMP"

      - name: Verify persistent signing identities with local signing probes
        if: inputs.preflight_only == true && inputs.profile_inspection_only != true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --local-signing-preflight-only \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --output-dir "$RUNNER_TEMP/macos-app-store-output"

      - name: Load Flutter version pinned by release source
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        working-directory: source
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        uses: ./.github/actions/setup-flutter-apple
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('source/pubspec.yaml', 'source/pubspec.lock') }}

      - name: Install native build tools
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          cmake --version

      - name: Install CocoaPods
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Install locked Flutter dependencies
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        working-directory: source
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned macOS native downloads
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform macos

      - name: Prepare run-local Swift package checkout
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        run: mkdir -p "$GITHUB_WORKSPACE/source/build/macos/SourcePackages"

      - name: Refresh pinned mpv Swift packages
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_macos_app_store_spm.py \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --release-tag "$RELEASE_TAG" \
            --main-commit "$GITHUB_SHA"

      - name: Install the locked Fastlane bundle in runner temp
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          [[ "$GEM_HOME" == "$RUNNER_TEMP/cocoapods-gems" ]]
          bundler_version="$(awk '$0 == "BUNDLED WITH" { getline; sub(/^[[:space:]]+/, ""); print; exit }' Gemfile.lock)"
          if [[ ! "$bundler_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Gemfile.lock has no supported pinned Bundler version." >&2
            exit 1
          fi
          gem install bundler --version "$bundler_version" --no-document \
            --install-dir "$GEM_HOME" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          export GEM_PATH="$GEM_HOME:${GEM_PATH:-$(gem env gempath)}"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          bundle install --jobs 4 --retry 3

      - name: Build, sign, export, upload and verify the exact Mac App Store build
        if: inputs.preflight_only != true && inputs.profile_inspection_only != true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          PLEAZYNG_DISCORD_APPLICATION_ID: ${{ vars.PLEAZYNG_DISCORD_APPLICATION_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --output-dir "$RUNNER_TEMP/macos-app-store-output" \
            --archive-path "$RUNNER_TEMP/macos-app-store-archive/Pleazyng.xcarchive" \
            --derived-data "$RUNNER_TEMP/macos-app-store-derived-data"

      - name: Attest uploaded installer package
        if: success() && inputs.preflight_only != true && inputs.profile_inspection_only != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/macos-app-store-output/pleazyng-macos-appstore.pkg

      - name: Retain signed package and App Store processing receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.profile_inspection_only == true && 'pleazyng-macos-appstore-profile-inspection' || inputs.preflight_only == true && 'pleazyng-macos-appstore-signing-preflight' || 'pleazyng-macos-appstore' }}-${{ inputs.release_tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-app-store-output/
          if-no-files-found: ignore
          retention-days: 30

  inspect-profiles:
    name: Inspect App Store profiles (read-only)
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && inputs.profile_inspection_only == true
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify workflow mode selection
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          PROFILE_INSPECTION_ONLY: ${{ inputs.profile_inspection_only }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_ONLY" == true && "$PROFILE_INSPECTION_ONLY" == true ]]; then
            echo "Choose either signing preflight or profile inspection." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the immutable product release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release source before profile inspection
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --validate-source-only \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --main-commit "$GITHUB_SHA"

      - name: Inspect current Mac App Store provisioning profiles (read-only)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --profile-inspection-only \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --output-dir "$RUNNER_TEMP/macos-app-store-profile-inspection"

      - name: Upload bounded provisioning profile metadata receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pleazyng-macos-appstore-profile-inspection-${{ inputs.release_tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-app-store-profile-inspection/
          if-no-files-found: ignore
          retention-days: 30
