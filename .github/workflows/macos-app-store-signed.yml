name: Signed macOS App Store release
run-name: macos-app-store:${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated immutable release tag to build and upload
        required: true
        type: string
        default: v3.0.36

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: pleazyng-macos-app-store-signing
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DASH__SUPPRESS_ANALYTICS: "true"
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-v1

jobs:
  build-upload:
    name: Build and upload signed Mac App Store package
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple","gha-{0}-macos-app-store"]}}', github.run_id)) }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the immutable product release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release source before running tagged code
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --validate-source-only \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --main-commit "$GITHUB_SHA"

      - name: Preflight macOS build disk capacity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --capacity-preflight-only \
            --minimum-free-gib 32 \
            --capacity-root "workspace=$GITHUB_WORKSPACE" \
            --capacity-root "source=$GITHUB_WORKSPACE/source" \
            --capacity-root "runner-temp=$RUNNER_TEMP"

      - name: Load Flutter version pinned by release source
        working-directory: source
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-apple
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-v2-${{ hashFiles('source/pubspec.yaml', 'source/pubspec.lock') }}

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs
          cmake --version

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          gem_path="$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$gem_path"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"
          export GEM_HOME="$RUNNER_TEMP/cocoapods-gems"
          export GEM_PATH="$gem_path"
          export PATH="$RUNNER_TEMP/cocoapods-bin:/opt/homebrew/bin:$PATH"
          pod --version

      - name: Install locked Flutter dependencies
        working-directory: source
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned macOS native downloads
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform macos

      - name: Prepare run-local Swift package checkout
        run: mkdir -p "$GITHUB_WORKSPACE/source/build/macos/SourcePackages"

      - name: Refresh pinned mpv Swift packages
        env:
          PLEAZYNG_APPLE_SOURCE_ROOT: ${{ github.workspace }}/source
        run: scripts/refresh_apple_spm.sh macos

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, sign, export, upload and verify the exact Mac App Store build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          PLEAZYNG_DISCORD_APPLICATION_ID: ${{ vars.PLEAZYNG_DISCORD_APPLICATION_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/build_macos_app_store_signed.py \
            --release-tag "$RELEASE_TAG" \
            --source-dir "$GITHUB_WORKSPACE/source" \
            --output-dir "$RUNNER_TEMP/macos-app-store-output" \
            --archive-path "$RUNNER_TEMP/macos-app-store-archive/Pleazyng.xcarchive" \
            --derived-data "$RUNNER_TEMP/macos-app-store-derived-data"

      - name: Attest uploaded installer package
        if: success()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/macos-app-store-output/pleazyng-macos-appstore.pkg

      - name: Retain signed package and App Store processing receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pleazyng-macos-appstore-${{ inputs.release_tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-app-store-output/
          if-no-files-found: ignore
          retention-days: 30
