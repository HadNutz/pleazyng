# ng-runner-policy: hosted-default-v2
name: Publish Relay Containers
run-name: ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publication action authorized on the protected default branch
        required: true
        type: choice
        options: [publish-containers]
      runner_pool:
        description: Runner pool for this publication
        required: true
        type: choice
        options: [public]
      release_tag:
        description: Published release tag to publish
        required: true
        type: string

# Publication gates run before checkout on a fresh hosted runner.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-build-${{ inputs.release_tag }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      published: ${{ steps.release.outputs.published }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Require the default branch for manual retries
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Manual container publications must run from main.' >&2
            exit 1
          fi

      - name: Resolve and validate published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          version="${tag#v}"
          metadata=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,publishedAt)
          [[ "$(jq -r .tagName <<<"$metadata")" == "$tag" ]] || { echo 'Release tag mismatch.' >&2; exit 1; }
          [[ "$(jq -r .isDraft <<<"$metadata")" == false ]] || { echo "Release $tag is still a draft." >&2; exit 1; }
          [[ -n "$(jq -r '.publishedAt // empty' <<<"$metadata")" ]] || { echo "Release $tag is not published." >&2; exit 1; }
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')
          if [[ "$tag_type" == tag ]]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$commit" --jq '.object.sha')
          fi
          branch=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if ! gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$branch" --jq '.status' | grep -Eq '^(ahead|identical)$'; then
            echo "Release $tag does not point to main or an ancestor of main." >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "version=$version"
            echo "published=$(jq -r .publishedAt <<<"$metadata")"
          } >> "$GITHUB_OUTPUT"

  platform:
    name: Build relay (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push native platform image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/snapetech-org/pleazyng-relay,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            REVISION=${{ needs.resolve.outputs.commit }}
            BUILD_DATE=${{ needs.resolve.outputs.published }}
          labels: |
            org.opencontainers.image.title=Pleazyng Relay
            org.opencontainers.image.description=Pleazyng authentication and artifact relay service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
          cache-from: type=gha,scope=pleazyng-relay-${{ matrix.arch }}
          cache-to: type=gha,scope=pleazyng-relay-${{ matrix.arch }},mode=max

      - name: Checkpoint platform digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/$ARCH.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Publish multi-architecture relay manifest
    needs: [resolve, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      version: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: relay-digest-*
          merge-multiple: true
          path: digests
      - name: Assemble and verify native platform digests
        id: manifest
        env:
          IMAGE: ghcr.io/snapetech-org/pleazyng-relay
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --metadata-file manifest.json --tag "$IMAGE:$VERSION" "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' manifest.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]
          '
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  mirror:
    runs-on: ubuntu-24.04
    needs: publish
    permissions:
      packages: read
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Docker Hub credentials are not configured; GHCR remains the release registry.'
          fi

      - name: Log in to GHCR
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror verified multi-architecture image
        if: steps.dockerhub.outputs.available == 'true'
        shell: bash
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          sudo apt-get update && sudo apt-get install -y skopeo
          src=ghcr.io/snapetech-org/pleazyng-relay
          dst=docker.io/snapetech/pleazyng-relay
          skopeo copy --authfile "$HOME/.docker/config.json" --all --preserve-digests "docker://$src@$DIGEST" "docker://$dst:$VERSION"
          actual=$(skopeo inspect --raw "docker://$dst:$VERSION" | sha256sum)
          test "${actual%% *}" = "${DIGEST#sha256:}"
  latest:
    needs: [publish, mirror]
    if: always() && needs.publish.result == 'success' && !cancelled()
    runs-on: ubuntu-24.04
    concurrency:
      group: relay-registry-latest
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promote the published release digest to latest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
          MIRROR_RESULT: ${{ needs.mirror.result }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "${current#v}" == "$VERSION" ]] || { echo "Latest release is $current"; exit 0; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          sudo apt-get update && sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          src=ghcr.io/snapetech-org/pleazyng-relay
          skopeo copy --all --preserve-digests "docker://$src@$DIGEST" "docker://$src:latest"
          if [[ "$MIRROR_RESULT" == success && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
            dst=docker.io/snapetech/pleazyng-relay
            skopeo copy --all --preserve-digests "docker://$dst@$DIGEST" "docker://$dst:latest"
          fi
