name: Native static analysis
on:
  pull_request:
    paths: ['**/*.kt', '**/*.swift', 'native/**', 'scripts/tv_mpv/**', 'docs/maintainers/native-lint/**', 'android/app/lint-baseline.xml', 'scripts/checks/native_*.py', '.github/workflows/native-lint.yml']
  push:
    branches: [main, 'integration/upstream-*']
    paths: ['**/*.kt', '**/*.swift', 'native/**', 'scripts/tv_mpv/**', 'docs/maintainers/native-lint/**', 'android/app/lint-baseline.xml', 'scripts/checks/native_*.py', '.github/workflows/native-lint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [kotlin, swift, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify findings and test-count ratchets
        if: matrix.language == 'kotlin'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-HEAD^}}"
          if [[ "$GITHUB_REF" == refs/heads/integration/upstream-* || "$base" =~ ^0+$ ]]; then base=origin/main; fi
          python3 scripts/checks/native_ratchet.py "$(git merge-base HEAD "$base")"
      - name: Load detekt
        if: matrix.language == 'kotlin'
        run: |
          curl -fLsS --retry 3 https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar -o "$RUNNER_TEMP/detekt.jar"
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  $RUNNER_TEMP/detekt.jar" | sha256sum -c -
          echo "LINTER=$RUNNER_TEMP/detekt.jar" >> "$GITHUB_ENV"
      - name: Load SwiftLint
        if: matrix.language == 'swift'
        run: |
          curl -fLsS --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  $RUNNER_TEMP/swiftlint.zip" | sha256sum -c -
          unzip -j "$RUNNER_TEMP/swiftlint.zip" '*swiftlint-static' -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint-static"
          echo "LINTER=$RUNNER_TEMP/swiftlint/swiftlint-static" >> "$GITHUB_ENV"
      - name: Load clang-tidy
        if: matrix.language == 'clang'
        run: |
          echo 'clang-tidy==19.1.0.1 --hash=sha256:511fb73f2c8d86a3b34eee7c4a91306bdb17fc6f9565a662dd5ffa7b4836891d' > "$RUNNER_TEMP/clang.txt"
          python3 -m venv "$RUNNER_TEMP/clang"
          "$RUNNER_TEMP/clang/bin/pip" install --no-deps --require-hashes -r "$RUNNER_TEMP/clang.txt"
          echo "LINTER=$RUNNER_TEMP/clang/bin/clang-tidy" >> "$GITHUB_ENV"
      - name: Analyze native sources
        env:
          LANGUAGE: ${{ matrix.language }}
        run: python3 scripts/checks/native_lint.py "$LANGUAGE" --tool "$LINTER"
  native-targets:
    name: C++ target (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [romm, steam]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load clang-tidy
        run: |
          echo 'clang-tidy==19.1.0.1 --hash=sha256:511fb73f2c8d86a3b34eee7c4a91306bdb17fc6f9565a662dd5ffa7b4836891d' > "$RUNNER_TEMP/clang.txt"
          python3 -m venv "$RUNNER_TEMP/clang"
          "$RUNNER_TEMP/clang/bin/pip" install --no-deps --require-hashes -r "$RUNNER_TEMP/clang.txt"
          echo "LINTER=$RUNNER_TEMP/clang/bin/clang-tidy" >> "$GITHUB_ENV"
      - name: Prepare Steam native dependencies
        if: matrix.engine == 'steam'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libvulkan-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev python3-jinja2
          python3 scripts/games/prepare_steam.py
      - name: Configure target and tests
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          args=()
          case "$ENGINE" in
            romm) args=(-DPLEZY_ROMM_BUILD_CORES=OFF -DPLEZY_ROMM_ISOLATED=ON -DPLEZY_ROMM_NATIVE_TESTS=ON);;
            steam) args=(-DPLEZY_STEAM_GSTREAMER=ON -DPLEZY_STEAM_TESTS=ON);;
          esac
          cmake -S "native/games/$ENGINE" -B "$RUNNER_TEMP/engine" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${args[@]}"
          cmake --build "$RUNNER_TEMP/engine" --parallel 2
      - name: Check changed native implementation and header lines with target flags
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE:-HEAD^}"
          if [[ "$GITHUB_REF" == refs/heads/integration/upstream-* || "$base" =~ ^0+$ ]]; then base=origin/main; fi
          python3 scripts/checks/native_lint.py clang --tool "$LINTER" --database "$RUNNER_TEMP/engine" --changed-lines "$base"
      - name: Run native target tests
        run: ctest --test-dir "$RUNNER_TEMP/engine" --output-on-failure --no-tests=error
  windows-target:
    name: C++ target (Windows Media Foundation and microphone)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned Steam native dependencies
        run: python scripts/games/prepare_steam.py
      - name: Compile Windows sinks and analyze changes against their SDK
        env:
          TARGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ tools and a Windows SDK are required' }
          $developer = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $environment = & cmd /d /s /c "call `"$developer`" -no_logo -arch=x64 >nul && set"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          $compiler = Join-Path $llvm 'clang-cl.exe'
          $tidy = Join-Path $llvm 'clang-tidy.exe'
          & $tidy --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = Join-Path $env:RUNNER_TEMP 'steam-windows'
          cmake -G Ninja -S native/games/steam -B $build "-DCMAKE_C_COMPILER=$compiler" "-DCMAKE_CXX_COMPILER=$compiler" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DPLEZY_STEAM_PYROWAVE=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $build --target plezy_steam_windows --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $base = $env:TARGET_BASE
          if (!$base -or $base -match '^0+$' -or $env:GITHUB_REF -like 'refs/heads/integration/upstream-*') { $base = 'origin/main' }
          python scripts/checks/native_lint.py clang --tool $tidy --database $build --changed-lines $base
          exit $LASTEXITCODE
