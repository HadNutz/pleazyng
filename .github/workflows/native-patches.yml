name: Native patch stacks
on:
  pull_request:
    paths: ['scripts/tv_mpv/**', 'native/visualizer/**', 'mpv-build.lock.json', 'scripts/checks/check_native_patch_stacks.py', '.github/workflows/native-patches.yml']
  push:
    branches: [main]
    paths: ['scripts/tv_mpv/**', 'native/visualizer/**', 'mpv-build.lock.json', 'scripts/checks/check_native_patch_stacks.py', '.github/workflows/native-patches.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        stack: [tv, visualizer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/checks/check_native_patch_stacks.py "${{ matrix.stack }}"
