            --build-receipt "$RUNNER_TEMP/apple-store-build-tvos-restored/build-provenance.json" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-tvos"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
