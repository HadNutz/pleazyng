# ng-runner-policy: hosted-default-v2
# Store screenshots are captured from real app builds on public hosted Macs.
name: Apple Store Screenshots
run-name: apple-store-screenshots:v3.0.36

on:
  workflow_dispatch:
    inputs:
      target:
        description: Capture all Apple platforms or only the named missing lanes.
        type: choice
        options:
          - all
          - ios-macos-only
          - macos-only
          - capture-only
          - macos-paywall-capture-only
          - app-in-use-capture-only
          - ios-in-use-capture-only
          - macos-in-use-capture-only
          - tvos-in-use-capture-only
        default: all
        required: true
      artifact_run_id:
        description: Completed main-branch run supplying partial captures or the required compiled app bundle(s).
        type: string
        required: false
      ios_artifact_run_id:
        description: Completed run supplying the verified iOS app bundle for app-in-use capture.
        type: string
        required: false
      macos_artifact_run_id:
        description: Completed run supplying the verified macOS app bundle for app-in-use capture.
        type: string
        required: false
      tvos_artifact_run_id:
        description: Completed run supplying the verified tvOS app bundle for app-in-use capture.
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: pleazyng-apple-store-screenshots-v3-0-36
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PUB_CACHE: ${{ github.workspace }}/.cache/plezy-pub-cache
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DASH__SUPPRESS_ANALYTICS: "true"

jobs:
  ios:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'ios-macos-only' || inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only' || inputs.target == '')
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v3.0.36
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: capture-tools
          persist-credentials: false

      - name: Verify the exact product source
        env:
          EXPECTED_SOURCE_SHA: 2388a06cc74d03e69ac7178fcd927a54460a5e3a
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v3.0.36^{commit}')" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Verify the prior build artifact producer
        id: producer
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only') && inputs.ios_artifact_run_id || inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple-store-screenshots.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" \
            --jq "if .workflow_id == $workflow_id and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .status == \"completed\" then [.head_sha, (.run_attempt | tostring)] | @tsv else error(\"build producer is not a completed main-branch Apple Store Screenshots dispatch\") end")"
          IFS=$'\t' read -r tool_sha run_attempt <<< "$metadata"
          [[ "$tool_sha" =~ ^[0-9a-f]{40}$ && "$run_attempt" =~ ^[0-9]+$ ]]
          echo "tool_sha=$tool_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download prior iOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-build-ios-v3.0.36
          run-id: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only') && inputs.ios_artifact_run_id || inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-build-ios-input

      - name: Validate and restore prior iOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only'
        env:
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only') && inputs.ios_artifact_run_id || inputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
          PRODUCER_TOOLS_SHA: ${{ steps.producer.outputs.tool_sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py restore-build \
            --product-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/apple-store-build-ios-input" \
            --platform ios \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --expected-capture-tools-sha "$PRODUCER_TOOLS_SHA" \
            --output-dir "$RUNNER_TEMP/apple-store-build-ios-restored"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-build-ios-restored/Pleazyng.app" >> "$GITHUB_ENV"

      - name: Install the UI capture project generator
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Load pinned Flutter SDK
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        run: python3 scripts/flutter/load_sdk_pin.py --github-env

      - name: Setup Flutter
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: '26.5'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Pub dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: apple-store-v3.0.36-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Install native build tools
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs

      - name: Install CocoaPods
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"

      - name: Install locked Flutter dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        run: flutter pub get --enforce-lockfile --no-example

      - name: Prefetch checksum-pinned iOS native downloads
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform ios

      - name: Prepare pinned iOS Steam sources
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: python3 scripts/games/prepare_steam.py

      - name: Resolve pinned iOS Swift packages
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        env:
          PLEAZYNG_APPLE_SOURCE_ROOT: ${{ github.workspace }}
        run: capture-tools/scripts/refresh_apple_spm.sh ios

      - name: Build the Store-mode iOS Simulator app
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        env:
          SOURCE_SHA: 2388a06cc74d03e69ac7178fcd927a54460a5e3a
        run: |
          set -euo pipefail
          flutter build ios --debug --simulator --no-codesign --no-pub \
            --dart-define=SUPPORTER_MODE=iap \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            --dart-define=GIT_COMMIT="$SOURCE_SHA" \
            --dart-define=PLEAZYNG_DISCORD_APPLICATION_ID=
          test -d build/ios/iphonesimulator/Pleazyng.app

      - name: Preserve the compiled iOS Simulator app before capture
        id: preserve-build
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py preserve-build \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$GITHUB_WORKSPACE/build/ios/iphonesimulator/Pleazyng.app" \
            --platform ios \
            --output-dir "$RUNNER_TEMP/apple-store-build-ios"
          echo "APPLE_STORE_APP_PATH=$GITHUB_WORKSPACE/build/ios/iphonesimulator/Pleazyng.app" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        with:
          name: apple-store-build-ios-v3.0.36
          path: |
            ${{ runner.temp }}/apple-store-build-ios/build-provenance.json
            ${{ runner.temp }}/apple-store-build-ios/pleazyng-apple-store-build-ios.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Capture actual iPhone and iPad app screens
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-ios \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --output-dir "$RUNNER_TEMP/apple-store-captures-ios"

      - name: Capture post-onboarding iPhone and iPad Files and Books screens
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py capture-ios-in-use \
            --product-root "$GITHUB_WORKSPACE" \
            --app "$APPLE_STORE_APP_PATH" \
            --build-receipt "$RUNNER_TEMP/apple-store-build-ios-restored/build-provenance.json" \
            --simulator-entitlements "$GITHUB_WORKSPACE/capture-tools/ios/Runner/DebugProfile.entitlements" \
            --output-dir "$RUNNER_TEMP/apple-store-in-use-captures-ios"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.target != 'app-in-use-capture-only' && inputs.target != 'ios-in-use-capture-only'
        with:
          name: apple-store-captures-ios-v3.0.36
          path: ${{ runner.temp }}/apple-store-captures-ios/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && (inputs.target == 'app-in-use-capture-only' || inputs.target == 'ios-in-use-capture-only')
        with:
          name: apple-store-in-use-captures-ios-v3.0.36
          path: ${{ runner.temp }}/apple-store-in-use-captures-ios/
          if-no-files-found: warn
          retention-days: 7

  tvos:
    if: github.repository == 'snapetech-org/pleazyng' && github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only' || inputs.target == '')
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v3.0.36
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: capture-tools
          persist-credentials: false

      - name: Verify the exact product source
        env:
          EXPECTED_SOURCE_SHA: 2388a06cc74d03e69ac7178fcd927a54460a5e3a
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v3.0.36^{commit}')" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Verify the prior build artifact producer
        id: producer
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only') && inputs.tvos_artifact_run_id || inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple-store-screenshots.yml" --jq .id)"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" \
            --jq "if .workflow_id == $workflow_id and .event == \"workflow_dispatch\" and .head_branch == \"main\" and .status == \"completed\" then [.head_sha, (.run_attempt | tostring)] | @tsv else error(\"build producer is not a completed main-branch Apple Store Screenshots dispatch\") end")"
          IFS=$'\t' read -r tool_sha run_attempt <<< "$metadata"
          [[ "$tool_sha" =~ ^[0-9a-f]{40}$ && "$run_attempt" =~ ^[0-9]+$ ]]
          echo "tool_sha=$tool_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download prior tvOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-store-build-tvos-v3.0.36
          run-id: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only') && inputs.tvos_artifact_run_id || inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-store-build-tvos-input

      - name: Validate and restore prior tvOS build
        if: inputs.target == 'capture-only' || inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        env:
          PRODUCER_RUN_ID: ${{ (inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only') && inputs.tvos_artifact_run_id || inputs.artifact_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
          PRODUCER_TOOLS_SHA: ${{ steps.producer.outputs.tool_sha }}
        run: |
          python3 capture-tools/scripts/capture_apple_store_screenshots.py restore-build \
            --product-root "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/apple-store-build-tvos-input" \
            --platform tvos \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --expected-capture-tools-sha "$PRODUCER_TOOLS_SHA" \
            --output-dir "$RUNNER_TEMP/apple-store-build-tvos-restored"
          echo "APPLE_STORE_APP_PATH=$RUNNER_TEMP/apple-store-build-tvos-restored/Runner.app" >> "$GITHUB_ENV"

      - name: Install the UI capture project generator
        if: inputs.target == 'app-in-use-capture-only' || inputs.target == 'tvos-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup the pinned tvOS Flutter SDK
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        uses: ./.github/actions/setup-flutter-apple
        with:
          hosted-xcode-version: '26.5'
          flutter-version: '3.47.1'

      - name: Cache Pub dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: apple-store-tvos-v3.0.36-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'pubspec_overrides_tvos.yaml') }}

      - name: Install native build tools
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v git-lfs >/dev/null || brew install git-lfs

      - name: Install CocoaPods
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          gem install cocoapods --version 1.17.0 --no-document \
            --install-dir "$RUNNER_TEMP/cocoapods-gems" \
            --bindir "$RUNNER_TEMP/cocoapods-bin"
          {
            echo "GEM_HOME=$RUNNER_TEMP/cocoapods-gems"
            echo "GEM_PATH=$RUNNER_TEMP/cocoapods-gems:$(gem env gempath)"
          } >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cocoapods-bin" >> "$GITHUB_PATH"

      - name: Resolve tvOS dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: tvos/scripts/pub_get.sh

      - name: Prefetch checksum-pinned tvOS native downloads
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: python3 scripts/prepare_native_downloads.py --sqlite-platform tvos

      - name: Fetch the checksum-pinned tvOS Flutter engine
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        run: tvos/scripts/fetch_engine.sh

      - name: Install tvOS CocoaPods dependencies
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          askpass="$RUNNER_TEMP/pleazyng-tvos-git-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*github.com*) printf '%s\n' x-access-token ;;
            *Password*github.com*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          tvos/scripts/pod_install.sh

      - name: Resolve pinned tvOS Swift packages
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          TVOS_DERIVED_DATA: ${{ runner.temp }}/apple-store-tvos-derived
          TVOS_SOURCE_PACKAGES: ${{ runner.temp }}/apple-store-tvos-source-packages
        run: |
          mkdir -p "$TVOS_DERIVED_DATA" "$TVOS_SOURCE_PACKAGES"
          xcodebuild -resolvePackageDependencies \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -derivedDataPath "$TVOS_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$TVOS_SOURCE_PACKAGES"
          python3 scripts/patch_amsmb2_manifest.py \
            --source-packages-dir "$TVOS_SOURCE_PACKAGES" \
            --resolved-package tvos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build the Store-mode tvOS Simulator app
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only' && inputs.target != 'tvos-in-use-capture-only'
        env:
          TVOS_DERIVED_DATA: ${{ runner.temp }}/apple-store-tvos-derived
          TVOS_SOURCE_PACKAGES: ${{ runner.temp }}/apple-store-tvos-source-packages
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$TVOS_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$TVOS_SOURCE_PACKAGES" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          test -d "$TVOS_DERIVED_DATA/Build/Products/Debug-appletvsimulator/Runner.app"

      - name: Preserve the compiled tvOS Simulator app before capture
        if: inputs.target != 'capture-only' && inputs.target != 'app-in-use-capture-only'
        env:
          PLEAZYNG_CAPTURE_TOOLS_SHA: ${{ github.sha }}
        run: |
