<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Pleazyng</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111419;
        color: #f6f6f7;
        font: 24px Roboto, sans-serif;
      }
      main {
        margin: 3vh 4vw;
      }
      form,
      nav {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 0.6rem 0;
      }
      input,
      button,
      select {
        font: inherit;
        padding: 0.4rem 0.7rem;
      }
      input {
        flex: 1;
      }
      #screen {
        position: relative;
        height: 67vh;
        background: black;
      }
      video,
      #output,
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      canvas {
        object-fit: contain;
      }
      video.filtered {
        opacity: 0;
      }
      #status {
        margin-left: auto;
      }
      button:focus,
      input:focus,
      select:focus {
        outline: 4px solid #7cceff;
      }
    </style>
  </head>
  <body>
    <main>
      <form id="open">
        <label for="url">Media URL</label
        ><input
          id="url"
          type="url"
          required
          placeholder="https://"
          autofocus
        /><button>Play</button>
      </form>
      <div id="screen">
        <video playsinline></video>
        <div id="output"></div>
      </div>
      <nav>
        <button id="toggle">Play / pause</button
        ><label for="strength">Motion smoothing</label
        ><select id="strength">
          <option value="off">Off</option>
          <option value="performance">Performance</option>
          <option value="quality">Quality</option></select
        ><span id="status" role="status">Original</span>
      </nav>
    </main>
    <script src="bundle.js"></script>
  </body>
</html>
