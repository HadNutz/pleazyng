# AAB Zipflinger can exhaust a small heap while compressing modules in parallel.
# Bound the common pool and reserve enough heap for bundle finalization on CI.
org.gradle.jvmargs=-Xmx6G -XX:ActiveProcessorCount=2 -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
# All bundled dependencies use AndroidX. Jetifier also cannot process modern
# JVM-only test artifacts when Android lint builds dependency models.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# The embedded Moonlight engine uses switch statements over resource IDs.
android.nonFinalResIds=false
# Android Gradle Plugin's optimized R8 resource shrinking requires non-final
# IDs. Keep final IDs for Moonlight and disable that optimization until it is
# compatible with this resource-ID use.
android.r8.optimizedResourceShrinking=false
